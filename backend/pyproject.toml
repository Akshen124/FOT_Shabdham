[project]
name = "fot-ai-backend"
version = "0.1.0"
description = "Backend for Shabdham Voice AI"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.115.0",
    "groq>=1.7.0",
    "deepgram-sdk>=7.12.0",
    "qdrant-client>=1.19.1",
    "redis>=8.1.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.2",
    "python-multipart>=0.0.20",
    "torch==2.14.1",
    "uvicorn>=0.35.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23.8",
    "fastembed>=0.9.0",
    "pypdf>=6.20.0",
    "python-dotenv>=1.2.4",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["..", "."]
